name: ReaPack

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reapack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check generated plugin and metadata
        run: python3 tools/check_package.py
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install indexer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc cmake pkg-config libssl-dev
          gem install reapack-index --version 1.2.6 --no-document
      - name: Validate ReaPack headers
        run: reapack-index --check

  publish:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install indexer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc cmake pkg-config libssl-dev
          gem install reapack-index --version 1.2.6 --no-document
      - name: Check current main before publishing
        run: |
          python3 tools/check_package.py
          reapack-index --check
      - name: Generate immutable download entries
        run: |
          reapack-index --no-commit --url-template "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/\$commit/\$path"
          python3 tools/check_index.py
      - name: Commit and push catalogue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.xml
          if git diff --cached --quiet; then
            echo 'Catalogue already current.'
          else
            git commit -m 'Update ReaPack index [skip ci]'
            git push origin HEAD:main
          fi
